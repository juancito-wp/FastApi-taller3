<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasador de Viviendas · IA</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07070f;
            --card: rgba(18, 18, 34, 0.72);
            --neon-cyan: #00f0ff;
            --neon-purple: #a855f7;
            --neon-pink: #ff2ec4;
            --text: #e8e9f3;
            --muted: #9a9cb5;
            --success: #00ffa3;
            --danger: #ff4d6d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
            position: relative;
        }

        /* ===== Fondo animado: aurora de blobs ===== */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            filter: blur(90px);
            opacity: 0.55;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: drift 18s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 45vmax;
            height: 45vmax;
            background: var(--neon-purple);
            top: -15%;
            left: -10%;
        }

        .blob-2 {
            width: 40vmax;
            height: 40vmax;
            background: var(--neon-cyan);
            bottom: -20%;
            right: -10%;
            animation-delay: -6s;
        }

        .blob-3 {
            width: 30vmax;
            height: 30vmax;
            background: var(--neon-pink);
            top: 40%;
            left: 55%;
            animation-delay: -12s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(8vw, -6vh) scale(1.15);
            }

            100% {
                transform: translate(-6vw, 8vh) scale(0.9);
            }
        }

        /* Rejilla sutil encima del fondo */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        /* ===== Tarjeta ===== */
        .scene {
            position: relative;
            z-index: 2;
            width: min(92vw, 460px);
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card {
            position: relative;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 2.6rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* Borde neón que rota */
        .card::before {
            content: "";
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    var(--neon-cyan) 60deg,
                    transparent 120deg,
                    var(--neon-purple) 240deg,
                    transparent 300deg);
            animation: spin 6s linear infinite;
            z-index: -1;
            opacity: 0.5;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 1.5px;
            border-radius: 23px;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: -1;
        }

        @keyframes spin {
            to {
                transform: rotate(1turn);
            }
        }

        /* Ícono flotante */
        .badge-icon {
            width: 74px;
            height: 74px;
            margin: 0 auto 1.2rem;
            display: grid;
            place-items: center;
            font-size: 2.1rem;
            color: var(--neon-cyan);
            border-radius: 22px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.25), inset 0 0 14px rgba(0, 240, 255, 0.12);
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-9px);
            }
        }

        h1 {
            margin: 0 0 0.4rem;
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 300% 0;
            }
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 2rem;
        }

        /* Etiqueta con punto "en vivo" */
        .label-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.55rem;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        /* Input */
        .input-wrap {
            position: relative;
            margin-bottom: 1.6rem;
        }

        .input-wrap i {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-purple);
            font-size: 1.2rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        input[type="number"] {
            width: 100%;
            padding: 1rem 1.1rem 1rem 3rem;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]::placeholder {
            color: #565a7a;
            font-weight: 400;
        }

        input[type="number"]:focus {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.12), 0 0 24px rgba(0, 240, 255, 0.2);
        }

        .input-wrap:focus-within i {
            color: var(--neon-cyan);
        }

        /* Botón */
        .btn-submit {
            position: relative;
            width: 100%;
            padding: 1.05rem;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #07070f;
            cursor: pointer;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 220% 100%;
            background-position: 0% 0;
            transition: background-position 0.5s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 28px rgba(168, 85, 247, 0.35);
            overflow: hidden;
        }

        .btn-submit:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(0, 240, 255, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0) scale(0.98);
        }

        /* Destello que barre el botón */
        .btn-submit::after {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                left: -80%;
            }

            55%,
            100% {
                left: 130%;
            }
        }

        /* ===== Resultado ===== */
        .result {
            margin-top: 1.8rem;
            padding: 1.5rem;
            border-radius: 18px;
            text-align: center;
            background: rgba(0, 255, 163, 0.06);
            border: 1px solid rgba(0, 255, 163, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 163, 0.12), inset 0 0 20px rgba(0, 255, 163, 0.05);
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(14px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--success);
            margin-bottom: 0.8rem;
        }

        .result .meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 0.6rem;
        }

        .result .precio {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.6rem, 7vw, 2.1rem);
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 24px rgba(0, 255, 163, 0.55);
            margin: 0;
            word-break: break-all;
        }

        .result .moneda {
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== Error ===== */
        .error {
            margin-top: 1.8rem;
            padding: 1.1rem 1.3rem;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 0.92rem;
            background: rgba(255, 77, 109, 0.08);
            border: 1px solid rgba(255, 77, 109, 0.4);
            color: var(--danger);
            animation: shake 0.5s ease both;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.4rem;
            }
        }
    </style>
</head>

<body>

    <!-- Fondo animado -->
    <div class="aurora">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="scene">
        <div class="card">

            <div class="badge-icon"><i class="bi bi-houses-fill"></i></div>
            <h1>Tasador de Viviendas</h1>
            <p class="subtitle">Predicción de precios con Machine Learning</p>

            <form method="POST" action="">
                {% csrf_token %}
                <div class="label-row"><span class="live-dot"></span> Área de la vivienda (m²)</div>
                <div class="input-wrap">
                    <input type="number" step="0.01" min="0" id="area_m2" name="area_m2" placeholder="Ej: 85.5"
                        required autofocus>
                    <i class="bi bi-rulers"></i>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="bi bi-lightning-charge-fill me-1"></i> Calcular Precio
                </button>
            </form>

            <!-- Sección de Resultados -->
            {% if resultado %}
            <div class="result">
                <span class="tag"><i class="bi bi-patch-check-fill"></i> Predicción exitosa</span>
                <p class="meta">Para una vivienda de <strong>{{ area }} m²</strong>, el valor estimado es:</p>
                <p class="precio" data-precio="{{ resultado|cut:'$' }}">$0.00</p>
                <span class="moneda">COP · Estimación del modelo</span>
            </div>
            {% endif %}

            <!-- Sección de Errores -->
            {% if error %}
            <div class="error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

        </div>
    </div>

    <script>
        // Animación count-up del precio predicho
        (function () {
            const el = document.querySelector('.precio');
            if (!el) return;

            const final = parseFloat(el.dataset.precio.replace(/[$,\s]/g, ''));
            if (isNaN(final)) {
                el.textContent = el.dataset.precio;
                return;
            }

            const duration = 1400;
            const start = performance.now();

            function tick(now) {
                const t = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 4); // easeOutQuart
                const value = final * eased;
                el.textContent = '$' + value.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                if (t < 1) requestAnimationFrame(tick);
            }

            requestAnimationFrame(tick);
        })();
    </script>

</body>

</html>
